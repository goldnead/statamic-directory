name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        stability: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, intl, fileinfo
          coverage: none

      - run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - run: vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest
    name: Code style

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: vendor/bin/pint --test

  standards:
    runs-on: ubuntu-latest
    name: Addon standards

    steps:
      - uses: actions/checkout@v4
        with:
          path: addon
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: goldnead/statamic-addon-studio
          path: studio

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: php studio/tools/addon-lint/bin/addon-lint addon --no-color --fail-on=major -v

  assets:
    runs-on: ubuntu-latest
    name: Built assets are current

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # @statamic/cms resolves from vendor/, so Composer must run first.
      - run: composer install --prefer-dist --no-interaction

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Fail if the committed bundle is stale
        run: git diff --exit-code -- resources/dist
